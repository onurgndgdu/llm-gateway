spring:
  application:
    name: llm-gateway

gateway:
  # Callers ask for an alias; which vendor serves it is an operational detail.
  # Order within a route is the failover policy.
  routes:
    fast:
      targets:
        - provider-id: mock
          upstream-model: mock-fast
    long-context:
      targets:
        - provider-id: mock
          upstream-model: mock-long

  resilience:
    default-policy:
      timeout: 30s
      max-attempts: 3
      initial-backoff: 200ms
      failure-rate-threshold: 50
      sliding-window-size: 20
      open-state-duration: 30s

  # Keyed by providerId:upstreamModel, in currency units per million tokens,
  # so the table can be compared directly against a vendor's pricing page.
  prices:
    "[mock:mock-fast]":
      input-per-million: 0.50
      output-per-million: 1.50
    "[mock:mock-long]":
      input-per-million: 3.00
      output-per-million: 15.00

  budgets:
    # No default cap: a gateway that starts rejecting traffic on deployment,
    # because nobody has set a limit yet, is worse than one that does not cap.
    default-daily:
    per-caller: {}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: llm-gateway

gateway:
  # Callers ask for an alias; which vendor serves it is an operational detail.
  # Order within a route is the failover policy.
  routes:
    fast:
      targets:
        - provider-id: mock
          upstream-model: mock-fast
    long-context:
      targets:
        - provider-id: mock
          upstream-model: mock-long

  resilience:
    default-policy:
      timeout: 30s
      max-attempts: 3
      initial-backoff: 200ms
      failure-rate-threshold: 50
      sliding-window-size: 20
      open-state-duration: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
